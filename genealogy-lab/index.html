<body>
  <main id="gate">
    <h1>加密页面</h1>
    <p>输入查看密码或编辑密码，打开对应版本。密码只用于本机解密，本页面不会发送或保存密码。</p>
    <section id="form" role="form" aria-label="本机解锁">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button id="unlock" type="button" disabled>解锁</button>
    </section>
    <p id="status" role="status" aria-live="polite">正在载入加密数据，完成后可解锁…</p>
    <p>这是两个独立加密版本，不是服务器账号或权限系统。解锁内容可被复制；编辑和下载仅在本机进行，不会更新共享页面。下载的文件可能是明文，请妥善保管。离开页面后需重新解锁。</p>
    <noscript><p>请启用 JavaScript，以便在本机解密。</p></noscript>
  </main>
  <iframe id="viewer" title="已解锁页面" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer" allow="camera 'none'; microphone 'none'; geolocation 'none'; clipboard-read 'none'; clipboard-write 'none'; payment 'none'; usb 'none'" hidden></iframe>
  <button id="lock" type="button" hidden>锁定页面</button>
  <section id="lock-warning" aria-label="锁定前确认" hidden>
    <p>锁定会关闭当前页面，未导出的编辑会丢失。请先导出需要保留的修改。</p>
    <div class="actions"><button id="confirm-lock" type="button">继续锁定</button><button id="cancel-lock" type="button">取消</button></div>
  </section>
  <script>
    // Bind before the large encrypted JSON arrives. Never submit credentials as a form.
    (function () {
      'use strict';
      var button = document.getElementById('unlock');
      var input = document.getElementById('password');
      var status = document.getElementById('status');
      var start = null, settled = false;
      function activate(event) {
        if (event) event.preventDefault();
        if (!start) { if (!settled) status.textContent = '加密数据仍在载入，请稍候…'; return; }
        start();
      }
      button.addEventListener('click', activate);
      input.addEventListener('keydown', function (event) { if (event.key === 'Enter') activate(event); });
      var timer = setTimeout(function () {
        if (!settled) status.textContent = '文件较大，仍在载入加密数据。请保持页面打开；若长时间未完成，请刷新重试。';
      }, 20000);
      window.GenealogyUnlockUI = {
        ready: function (fn) { start = fn; settled = true; clearTimeout(timer); button.disabled = false; status.textContent = '已准备好，请输入密码解锁。'; },
        fail: function (message) { start = null; settled = true; clearTimeout(timer); button.disabled = true; status.textContent = message; }
      };
      window.addEventListener('error', function () {
        if (!settled) window.GenealogyUnlockUI.fail('解锁程序未能启动，请刷新页面或换用较新的浏览器。密码尚未发送。');
      });
      window.addEventListener('DOMContentLoaded', function () {
        if (!settled) window.GenealogyUnlockUI.fail('加密数据或解锁程序未完整载入，请刷新重试。');
      });
    }());
  </script>
