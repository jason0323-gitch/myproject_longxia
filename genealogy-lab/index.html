  <script>
    'use strict';
    try {
    const $ = id => document.getElementById(id);
    const bytes = value => {
      const binary = atob(value);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    };
    if (typeof TextEncoder !== 'function' || typeof TextDecoder !== 'function') throw new Error('Unsupported text codecs');
    const encoder = new TextEncoder();
    const aad = encoder.encode('private-static-dual-page-v2');
    let payload = null;
    let busy = false;
    let generation = 0;
    let unlockedRole = null;

    try {
      const candidate = JSON.parse($('encrypted-payload').textContent);
      if (candidate.version !== 2 || candidate.format !== 'encrypted-static-dual-v2' ||
          !Array.isArray(candidate.entries) || candidate.entries.length !== 2 ||
          candidate.entries[0].role !== 'view' || candidate.entries[1].role !== 'edit') {
        throw new Error('Unsupported format');
      }
      for (const entry of candidate.entries) {
        if (entry.kdf !== 'PBKDF2-SHA256' || entry.iterations !== 600000 ||
            typeof entry.salt !== 'string' || typeof entry.iv !== 'string' ||
            typeof entry.ciphertext !== 'string' || bytes(entry.salt).length !== 16 ||
            bytes(entry.iv).length !== 12 || entry.ciphertext.length < 24 ||
            entry.ciphertext.length % 4 !== 0 || !/^[A-Za-z0-9+/]*={0,2}$/.test(entry.ciphertext)) {
          throw new Error('Invalid parameters');
        }
      }
      payload = candidate;
    } catch (_) {
      $('status').textContent = '加密文件格式无效或已损坏。';
      $('unlock').disabled = true;
    }

    function lock(message = '已锁定，请重新输入密码。') {
      // Invalidate every pending import/derive/decrypt before resetting the UI.
      generation += 1;
      busy = false;
      unlockedRole = null;
      // Remove the browsing context entirely, not just hide the decrypted DOM.
      const oldFrame = $('viewer');
      const cleanFrame = oldFrame.cloneNode(false);
      cleanFrame.removeAttribute('srcdoc');
      cleanFrame.hidden = true;
      oldFrame.replaceWith(cleanFrame);
      $('lock').hidden = true;
      $('lock-warning').hidden = true;
      $('lock').textContent = '锁定页面';
      $('gate').hidden = false;
      $('password').value = '';
      $('password').disabled = false;
      $('unlock').disabled = !payload;
      $('status').textContent = message;
    }

    $('lock').addEventListener('click', () => {
      if (unlockedRole === 'edit') {
        $('lock-warning').hidden = false;
        $('cancel-lock').focus();
        return;
      }
      lock();
      $('password').focus();
    });
    $('confirm-lock').addEventListener('click', () => {
      if ($('lock-warning').hidden) return;
      lock();
      $('password').focus();
    });
    $('cancel-lock').addEventListener('click', () => {
      $('lock-warning').hidden = true;
      $('lock').focus();
    });
    window.addEventListener('pagehide', () => lock());

    async function unlockLocal() {
      if (busy || !payload) return;
      if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
        $('status').textContent = '此浏览器环境不支持安全解密，请在支持 HTTPS 的浏览器中打开。';
        return;
      }
      if (!$('password').value) { $('status').textContent = '请输入密码。'; $('password').focus(); return; }
      const attempt = ++generation;
      busy = true;
      $('unlock').disabled = true;
      $('password').disabled = true;
      $('status').textContent = '正在本机解密…';
      $('lock').textContent = '取消解锁';
      $('lock').hidden = false;
      let secret = encoder.encode($('password').value);
      $('password').value = '';
      let plain = null;
      let material = null;
      let key = null;
      try {
        material = await window.crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveKey']);
        secret.fill(0);
        secret = null;
        if (attempt !== generation) return;
        for (const entry of payload.entries) {
          key = await window.crypto.subtle.deriveKey({
            name: 'PBKDF2', hash: 'SHA-256', salt: bytes(entry.salt), iterations: entry.iterations
          }, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
          if (attempt !== generation) return;
          try {
            plain = await window.crypto.subtle.decrypt({
              name: 'AES-GCM', iv: bytes(entry.iv), additionalData: aad, tagLength: 128
            }, key, bytes(entry.ciphertext));
          } catch (_) {
            if (attempt !== generation) return;
            continue;
          } finally {
            key = null;
          }
          if (attempt !== generation) return;
          // The successful document itself determines its capabilities. The
          // public role label never enables editing or selects a plaintext page.
          $('viewer').srcdoc = new TextDecoder('utf-8', {fatal: true}).decode(plain);
          new Uint8Array(plain).fill(0);
          plain = null;
          $('viewer').hidden = false;
          unlockedRole = entry.role;
          $('lock').textContent = '锁定页面';
          $('gate').hidden = true;
          $('status').textContent = '';
          return;
        }
        throw new Error('No matching entry');
      } catch (_) {
        if (attempt === generation) {
          $('status').textContent = '密码不正确，或加密文件已损坏。';
          $('lock').hidden = true;
        }
      } finally {
        if (secret) secret.fill(0);
        if (plain) new Uint8Array(plain).fill(0);
        secret = null;
        plain = null;
        material = null;
        key = null;
        // An older attempt must never unlock or alter a newer attempt's state.
        if (attempt === generation) {
          busy = false;
          $('password').value = '';
          $('password').disabled = false;
          $('unlock').disabled = false;
        }
      }
    }
    if (payload) window.GenealogyUnlockUI.ready(unlockLocal);
    else window.GenealogyUnlockUI.fail('加密文件格式无效或已损坏，请刷新重试。');
    } catch (_) {
      window.GenealogyUnlockUI.fail('此浏览器无法启动本地解锁程序，请使用较新的浏览器。密码尚未发送。');
    }
  </script>
