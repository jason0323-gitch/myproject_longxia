l" class="secondary">使用离线人工模式</button><div class="notice">Chrome 浏览器语音识别可能把儿童声音发送给 Google 进行转写，不能判断声调是否正确。仅在家长明确同意 Google 接收儿童本次语音后启用；每次重开页面都需重新同意。不自动切换讯飞或其他服务。</div><button data-action="consent">了解并选择浏览器辅助识别</button><p><strong>讯飞声学评测：尚未接入。</strong>需要服务端签名与专项家长同意，不能把 APISecret 放入公开 HTML。离线文件不会收集密钥。</p></details><details><summary>备份与文件复用</summary><p>当前进度保存在这个浏览器。移动文件、清理浏览器数据或更换设备可能使进度不可见，请定期导出。</p><div class="toolbar"><button data-action="export">导出进度备份</button><label class="pill">导入备份 <input type="file" id="importBackup" accept="application/json,.json" style="max-width:170px"></label><button data-action="downloadHTML">下载当前词表的单文件HTML</button></div><p class="muted">HTML导出包含词表、本页全部录音（含你导入的音频）和非私人默认设置，不含孩子昵称、练习记录或浏览器识别同意。</p></details><details><summary>声音来源与已知边界</summary><p>本项目从零搭建，18段真人整词候选音来自 Yue Tan / Shtooka，经 audio-cmn 整理，CC BY-SA 3.0 US。保留原录音，无单字切割。这18段整词参考音已由本次陪练家长试听接受，可直接使用；不代表专业普通话认证或逐音校准。替换、导入录音仍需重新试听确认。</p><p>慢听仅以0.8倍保调播放，不是原生慢速录制。没有152段四层音库，不提供未经听审的机械拆音。打理、菠萝暂无录音，需家长带读或导入有授权的整词音。</p><p><a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener">音频来源与许可说明</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/us/" target="_blank" rel="noopener">CC BY-SA 3.0 US</a></p></details>`);$('#settingsForm').onsubmit=e=>{e.preventDefault();state.config.nickname=$('#nickname').value.trim()||'小小探险家';state.config.title=$('#title').value.trim()||'读一读二';state.config.requirements=$('#requirements').value.trim();state.config.rewards=[0,1,2].map(i=>$('#reward'+i).value.trim()||'一起庆祝');state.config.motion=$('#motion').value;state.config.unlock=Number($('#unlock').value);save();closeModal();render();toast('设置已保存在本机。')};$('#importBackup').onchange=importBackup}
function audioPanel(){modal('参考音 · 逐词试听复核',`<div class="notice">本版18段原始整词音已获家长试听接受，无需重复勾选。你仍可取消使用；替换或新导入录音需要重新试听。此状态不是教师认证，也不代表声韵分层校准。</div>${state.config.words.map((w,i)=>`<div class="audio-row"><div><strong>${esc(w.text)}</strong><small>${esc(w.pinyin)} · ${audioApproved(w)?'家长试听已接受':AUDIO[w.text]?'待试听参考音':'暂无录音'}</small></div><button class="small" data-preview="${i}" ${!AUDIO[w.text]?'disabled':''}>试听</button><label class="check"><input type="checkbox" data-approve="${i}" ${audioApproved(w)?'checked':''} ${!AUDIO[w.text]?'disabled':''}>家长已复核</label></div>`).join('')}<details><summary>导入有授权的整词录音</summary><div class="field"><label for="audioWord">对应词语</label><select id="audioWord">${state.config.words.map(w=>`<option>${esc(w.text)}</option>`).join('')}</select></div><div class="field"><label for="audioFile">MP3 / WAV / OGG（每段不超过2MB）</label><input type="file" id="audioFile" accept="audio/mpeg,audio/wav,audio/ogg"></div><p class="muted">仅在本页内存中使用；如需保留，请下载当前单文件HTML。不要导入未经同意的儿童声音。</p></details><button class="secondary" data-action="technicalCheck">检查所有候选音是否能解码</button><p id="audioAudit" role="status"></p>`);$$('[data-preview]').forEach(b=>b.onclick=()=>playAudio(state.config.words[+b.dataset.preview],false,true));$$('[data-approve]').forEach(b=>b.onchange=()=>{state.config.approved[state.config.words[+b.dataset.approve].text]=b.checked?audioStamp(state.config.words[+b.dataset.approve].text):false;save()});$('#audioFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024||!/^audio\/(mpeg|wav|x-wav|ogg)$/.test(f.type))return toast('请使用不超过2MB的 MP3、WAV 或 OGG 文件。');const wordName=$('#audioWord').value;const reader=new FileReader();reader.onload=()=>{AUDIO[wordName]=reader.result;state.config.approved[wordName]=false;save();if($('#dialog').open)audioPanel();toast('录音已载入，请试听复核后再启用。')};reader.readAsDataURL(f)}}
function $$(s){return Array.from(document.querySelectorAll(s))}
function saveWords(){let lines=$('#wordList').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length||lines.length>100)return toast('请提供1–100行词语。');let seen=new Set(),words=[];for(let line of lines){let parts=line.split(/[|｜]/).map(x=>x.trim());if(parts.length!==2||!parts[0]||!parts[1]||parts[0].length>60||parts[1].length>20||seen.has(parts[1]))return toast('请检查格式、长度或重复词，每行“拼音 | 词语”。');seen.add(parts[1]);let original=DEFAULT_WORDS.find(w=>w.text===parts[1]&&w.pinyin===parts[0]);words.push(original||{pinyin:parts[0].normalize('NFC'),text:parts[1],split:parts[0].normalize('NFC'),tip:'新词请先核对老师要求，再慢慢示范。'})}if(JSON.stringify(words.map(w=>[w.pinyin,w.text]))===JSON.stringify(state.config.words.map(w=>[w.pinyin,w.text])))return toast('词表没有变化，保留当前进度。');state.history.unshift(state.session);state.history=state.history.slice(0,30);state.config.words=words;state.session=fresh();save();closeModal();navigate('home');toast('新作业已开启，累计星星保留。')}
function reportText(){const s=state.session,n=state.config.words.length;const entries=s.rounds.flatMap(r=>Object.values(r));const assisted=entries.filter(x=>x.assisted).length;const self=entries.filter(x=>x.evidence==='self').length;const browser=entries.filter(x=>x.evidence==='browser-text').length;return `${state.config.title}：今天完成${s.done.length}遍（每遍${n}词），三遍覆盖分别为${s.rounds.map(r=>Object.keys(r).length+'/'+n).join('、')}。其中家长带读${assisted}词次，自行确认${self}词次，浏览器文字匹配${browser}词次。明天可再读：${Object.keys(s.practice).join('、')||'暂无标记'}。以上为练习记录，未做声调准确度认证。`}
function report(){const s=state.session,entries=s.rounds.flatMap(r=>Object.values(r)),counts={};entries.forEach(x=>counts[x.evidence]=(counts[x.evidence]||0)+1);modal('今日练习报告',`<p class="muted">${esc(s.date)} · ${esc(state.config.title)} · 仅家长查看</p><div class="statgrid"><div class="stat"><strong>${s.done.length}/3</strong>完成遍数</div><div class="stat"><strong>${s.stars}</strong>练习星</div><div class="stat"><strong>${Math.round(s.seconds/60)}</strong>活跃分钟</div></div><p>三遍覆盖：${s.rounds.map((r,i)=>`第${i+1}遍 ${Object.keys(r).length}/${state.config.words.length}`).join(' · ')}</p><p>连续完成最多 ${s.best} 词（不是连续读对数）。</p><div class="notice">自行确认 ${counts.self||0} 次；家长自主确认 ${counts.parent||0} 次；家长带读 ${counts['parent-assisted']||0} 次；浏览器文字匹配 ${counts['browser-text']||0} 次。没有声学或声调评分。</div><h3>明天可以再读一读</h3>${Object.keys(s.practice).length?Object.entries(s.practice).map(([w,reason])=>`<div class="report-word"><div><strong>${esc(w)}</strong><p>${esc(state.config.words.find(x=>x.text===w)?.tip||'请家长慢慢示范，再练习。')}</p></div><small>${esc(reason)}</small></div>`).join(''):'<p>暂无再练标记；这不代表所有音已掌握。</p>'}<h3>可复制给老师的练习记录</h3><div class="field"><textarea id="reportText" readonly>${esc(reportText())}</textarea></div><div class="toolbar"><button class="primary" data-action="copyReport">复制文案</button><button data-action="printSheet">打印打卡纸</button>${s.done.length===3?'<button data-action="certificate">打印奖状</button>':''}</div>`)}
function printSheet(){modal('离屏打卡纸',`<section><h1>${esc(state.config.title)} · 拼读打卡</h1><p>姓名：________　日期：________　每读一遍，由家长在格子里画一颗星。</p><table><thead><tr><th>拼音</th><th>词语</th><th>第1遍</th><th>第2遍</th><th>第3遍</th></tr></thead><tbody>${state.config.words.map(w=>`<tr><td>${esc(w.pinyin)}</td><td>${esc(w.text)}</td><td>□</td><td>□</td><td>□</td></tr>`).join('')}</tbody></table><p>读不准或需要反应时间是正常的，及时示范即可。记录练习，不排名、不扣分。</p></section><button class="primary no-print" data-action="print">打印 / 存成PDF</button>`)}
function certificate(){if(state.session.done.length!==3)return toast('完成三遍练习后领取奖状。');modal('我的练习奖状',`<section class="certificate"><div style="font-size:70px">🏆</div><h1>勇敢开口小能手</h1><h2>${esc(state.config.nickname)}</h2><p>认真完成了「${esc(state.config.title)}」三遍练习。</p><p>每一次开口，都是向前的一小步！</p><p>${esc(day())}</p><small>这是一张练习完成奖状，不是发音等级证明。</small></section><button class="primary no-print" data-action="print">打印奖状</button>`)}
function startGame(){if(state.session.done.length<state.config.unlock)return;game={indices:shuffle(state.config.words.map((_,i)=>i)).slice(0,8),pos:0,stars:0,first:0,wrong:false};navigate('game')}
function bubbleView(){if(!game)return home();if(game.pos===game.indices.length)return `<section class="complete"><div class="big">🫧</div><h1>泡泡全收集！</h1><p>找到了 ${game.stars} 位词语朋友。${game.first===game.indices.length?'获得「连对小高手」徽章！':'获得「泡泡小能手」徽章！'}</p><div class="actions"><button class="primary" data-action="game">再玩一局</button><button data-action="home">回小站休息</button></div></section>`;if(!question){let index=game.indices[game.pos],mode=game.pos%2===0&&audioApproved(state.config.words[index])?0:1;question=makeQuestion(index,mode)}const w=state.config.words[question.index];return `<section class="word-card"><span class="pill">泡泡乐园 · ${game.pos+1}/${game.indices.length}</span><h2>${question.mode===0?'听一听，找到词语朋友':'看拼音，找到词语朋友'}</h2>${question.mode===0?'<button class="primary" data-action="gameListen">🔊 听声音</button>':`<div class="pinyin">${esc(w.pinyin)}</div>`}<div class="bubble-field">${question.choices.map(i=>`<button class="bubble" data-bubble="${i}">${esc(state.config.words[i].text)}</button>`).join('')}</div><p class="muted">没有时间限制，想休息就回小站。</p></section>`}
function chooseBubble(i){if(guard||!game||!question)return;if(i!==question.index){game.wrong=true;toast('再看看，词语朋友就在这里。');return}guard=true;game.stars++;state.gameStars++;if(!game.wrong)game.first++;game.wrong=false;game.pos++;question=null;save();celebrateParticles(12);render();setTimeout(()=>guard=false,280)}
function consentDialog(){modal('家长选择 · 浏览器语音识别',`<p>此选项仅支持 Chrome（Google）浏览器。启用后，按“请浏览器听一听”时，儿童语音可能发送至 Google 的识别服务做文字转写，可能需要联网。</p><p>这不是拼音声学评测，不能判断声调、声母或韵母是否标准。低置信度、超时、无声和转写不匹配都不判孩子读错。</p><p>本页面不保存录音、不保存转写文本；Google 的留存及处理受其政策约束，本项目没有核验不留存或不训练承诺。</p><p><a href="https://policies.google.com/privacy" target="_blank" rel="noopener">阅读 Google 隐私政策</a></p><label class="check"><input id="consentCheck" type="checkbox">我是监护人，同意本次在 Chrome 中使用 Google 语音识别处理孩子练习声音。</label><div class="actions"><button class="primary" data-action="enableBrowser">本次启用</button><button data-action="close">保持离线人工</button></div>`)}
function enableBrowser(){if(!$('#consentCheck').checked)return toast('未同意，继续使用离线人工模式。');if(!/Chrome\//.test(navigator.userAgent)||/Edg\//.test(navigator.userAgent)||!(window.SpeechRecognition||window.webkitSpeechRecognition))return toast('当前不是支持的 Chrome 语音识别环境，请使用离线人工模式。');consented=true;state.config.engine='browser';save();closeModal();render();toast('本次辅助识别已启用，按麦克风按钮才会开始。')}
function normalizeText(s){return s.replace(/[\s。，！？、,.!?]/g,'')}
function judgePronunciation(expected,result){if(!result||result.kind==='error'||result.confidence<.65||!result.text)return {kind:'unknown'};return normalizeText(result.text)===normalizeText(expected.text)?{kind:'text-match'}:{kind:'unknown'}}

const hints={

'service-not-allowed':'浏览器拒绝了识别服务。请家长检查浏览器或管理策略；不要反复调整麦克风。',

function recognize(){if(!consented||state.config.engine!=='browser'||recognition)return;stopMedia();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('浏览器识别不可用，请人工确认。');const word=target();if(!word)return;const epoch=playEpoch;recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;recognition.continuous=false;let received=false,timedOut=false;const timer=setTimeout(()=>{if(epoch!==playEpoch||received)return;timedOut=true;received=true;const active=recognition;recognition=null;try{active?.abort()}catch(e){}screenStatus=recognitionErrorMessage('local-timeout');render()},10000);screenStatus='正在听…说完后稍等一下。';render();recognition.onresult=e=>{received=true;clearTimeout(timer);if(epoch!==playEpoch)return;const item=e.results[0][0];const result=judgePronunciation(word,{text:item.transcript,confidence:item.confidence});recognition=null;if(result.kind==='text-match'){screenStatus='文字匹配到了；声调仍需家长听辨。';finishWord('browser-text')}else{screenStatus='这次没听清，请再读一遍，或请家长帮忙。';render()}};recognition.onerror=e=>{clearTimeout(timer);if(epoch!==playEpoch)return;received=true;recognition=null;screenStatus=recognitionErrorMessage(timedOut?'local-timeout':e?.error);render()};recognition.onend=()=>{clearTimeout(timer);if(epoch!==playEpoch||received)return;recognition=null;screenStatus='这次没听清，没有算读错。请再读或人工确认。';render()};try{recognition.start()}catch(e){clearTimeout(timer);received=true;recognition=null;screenStatus=recognitionErrorMessage(e?.name==='InvalidStateError'?'local-busy':e?.name==='NotAllowedError'?'not-allowed':e?.name==='SecurityError'?'local-security':'local-start-failed');render()}}
function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){download('拼读闯关-本机进度备份.json',JSON.stringify({schema:1,state},null,2),'application/json');toast('备份可能含孩子昵称，请妥善保管，不要公开上传。')}
async function importBackup(e){let f=e.target.files[0];if(!f)return;if(f.size>1000000)return toast('备份过大，请检查文件。');try{const data=JSON.parse(await f.text()),s=data.state;if(data.schema!==1||!validState(s))throw Error();if(!confirm('导入备份会替换本机当前练习进度。确定继续？'))return;s.config.engine='manual';state=s;consented=false;save();closeModal();navigate('home');toast('备份已导入，仍使用离线人工模式。')}catch(e){toast('备份格式无效，当前进度未改变。')}}
function downloadHTML(){let html='<!doctype html>\n'+document.documentElement.outerHTML;html=html.replace(/<div id="app">[\s\S]*?<\/main><\/div>/,'<div id="app"></div>').replace(/<dialog id="dialog"[\s\S]*?<\/dialog>/,'<dialog id="dialog"><div id="modal"></div></dialog>');html=html.replace(/const DEFAULT_WORDS=[\s\S]*?;\n/,()=>`const DEFAULT_WORDS=${JSON.stringify(state.config.words).replace(/</g,'\\u003c')};\n`);html=html.replace(/<script id="audioData" type="application\/json">[\s\S]*?<\/script>/,()=>`<script id="audioData" type="application/json">${JSON.stringify(AUDIO).replace(/</g,'\\u003c')}<\/script>`);download('拼读闯关-读一读二.html',html,'text/html')}
async function technicalCheck(){const out=$('#audioAudit');if(!out)return;out.textContent='正在逐段检查解码…';const AC=window.AudioContext||window.webkitAudioContext;if(!AC){out.textContent='浏览器不支持音频解码检查。';return}let context=new AC(),ok=0,bad=[];for(const [word,url] of Object.entries(AUDIO)){try{const bytes=Uint8Array.from(atob(url.split(',')[1]),c=>c.charCodeAt(0));let data=await context.decodeAudioData(bytes.buffer);if(data.duration>0)ok++;else bad.push(word)}catch(e){bad.push(word)}}await context.close();if(out.isConnected)out.textContent=`${ok} 段可解码，${bad.length} 段异常${bad.length?'：'+bad.join('、'):''}。这不是发音正确性或讯飞评分检测。`}
function bind(root=document){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));root.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>begin(+b.dataset.round));root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));root.querySelectorAll('[data-bubble]').forEach(b=>b.onclick=()=>chooseBubble(+b.dataset.bubble))}
function action(a){switch(a){case'home':navigate('home');break;case'start':state.session.done.length===3?report():begin(Math.min(2,state.session.done.length));break;case'parents':parents();break;case'close':closeModal();break;case'listen':playAudio(target());break;case'slow':playAudio(target(),true);break;case'self':selfConfirm();break;case'help':help();break;case'retry':state.session.practice[target().text]='主动选择再练';save();openHint(target());break;case'assisted':closeModal();if(roundChosen===2)state.session.selected=true;finishWord('parent-assisted');break;case'parentIndependent':closeModal();state.session.assisted=false;finishWord('parent');break;case'modalSlow':playAudio(target(),true);break;case'game':closeModal();startGame();break;case'gameListen':playAudio(state.config.words[question.index]);break;case'report':report();break;case'certificate':certificate();break;case'printSheet':printSheet();break;case'print':window.print();break;case'audioPanel':audioPanel();break;case'saveWords':saveWords();break;case'export':exportBackup();break;case'downloadHTML':downloadHTML();break;case'manual':consented=false;state.config.engine='manual';save();stopMedia();toast('已切换为离线人工模式。');break;case'consent':consentDialog();break;case'enableBrowser':enableBrowser();break;case'recognize':recognize();break;case'technicalCheck':technicalCheck();break;case'copyReport':navigator.clipboard?navigator.clipboard.writeText(reportText()).then(()=>toast('已复制练习记录。')).catch(()=>toast('请长按文案手动复制。')):toast('请长按文案手动复制。');break}}
$('#dialog').addEventListener('cancel',stopMedia);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMedia()});setInterval(()=>{rollover();if(view==='play'&&!document.hidden&&!$('#dialog').open){state.session.seconds+=10;save()}},10000);
// Recognition consent is intentionally not persisted across page openings.
state.config.engine='manual';rollover();render();
window.PinyinTest={judgePronunciation,getState:()=>state,getView:()=>view,begin,finishWord,choose,level};

</script></body></html>
